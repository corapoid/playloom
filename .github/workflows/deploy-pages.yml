name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy; defaults to the latest CHANGELOG version"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository and tags
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: release
        env:
          RELEASE_VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="$RELEASE_VERSION_INPUT"
          if [[ -z "$version" ]]; then
            while IFS= read -r line; do
              if [[ "$line" =~ ^##[[:space:]]([0-9]+\.[0-9]+\.[0-9]+)([[:space:]]|$) ]]; then
                version="${BASH_REMATCH[1]}"
                break
              fi
            done < CHANGELOG.md
          fi
          version="${version#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Invalid release version: %s\n' "$version" >&2
            exit 1
          fi
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Build versioned static site
        run: bash scripts/build-pages.sh "${{ steps.release.outputs.version }}" "$GITHUB_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
